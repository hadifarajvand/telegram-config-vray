mode: rule

profile:
  store-selected: true

sub-url: &sub-url "http://192.168.1.100:8888/clash/ipv4"

tun:
  enable: true
  stack: mixed
  auto-detect-interface: true
  strict-route: false

dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  nameserver:
    - tls://1dot1dot1dot1.cloudflare-dns.com
    - https://dns.google/dns-query
    - https://1.0.0.1/dns-query
    - https://cloudflare-dns.com/dns-query
  nameserver-policy:
    "+.lan,+.in-addr.arpa": system
    geosite:cn,private:
      - system
      - 223.5.5.5
      - 223.6.6.6
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
      - https://doh.pub/dns-query
  fake-ip-filter:
    - dns.msftncsi.com
    - www.msftconnecttest.com
    - ipv6.msftconnecttest.com
    - "*.lan"
    - "*.local"
    - "*.localhost"
    - "*.home.arpa"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"

proxy-providers:
  DefaultSub:
    {
      type: http,
      url: *sub-url,
      interval: 14400,
      health-check:
        {
          enable: true,
          interval: 600,
          url: "http://cp.cloudflare.com/generate_204",
        },
      override: { ip-version: ipv4-prefer },
    }

proxy-groups:
  - { name: Proxy Select, type: select, use: [DefaultSub] }
  - { name: Domestic, type: select, proxies: [DIRECT, Proxy Select], use: [DefaultSub] }
  - { name: Proxy, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Google, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: GitHub, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Microsoft, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Netflix, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Speedtest, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Steam, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Spotify, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Telegram, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Twitter, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Discord, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Apple, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }
  - { name: Unmatched, type: select, proxies: [Proxy Select, DIRECT], use: [DefaultSub] }

rule-providers:
  Google:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Google.yaml,
      url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Google/Google.yaml",
      interval: 14400,
    }
  GitHub:
    {
      type: http,
      behavior: classical,
      path: ./Rule/GitHub.yaml,
      url: "https://raw.githubusercontent.com/Semporia/Clash/master/Rule/GitHub.yaml",
      interval: 14400,
    }
  Microsoft:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Microsoft.yaml,
      url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/Microsoft/Microsoft.yaml",
      interval: 14400,
    }
  Netflix:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Netflix.yaml,
      url: "https://raw.githubusercontent.com/Semporia/Clash/master/Rule/Netflix.yaml",
      interval: 14400,
    }
  Speedtest:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Speedtest.yaml,
      url: "https://raw.githubusercontent.com/Semporia/Clash/master/Rule/Speedtest.yaml",
      interval: 14400,
    }
  Steam:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Steam.yaml,
      url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Steam/Steam.yaml",
      interval: 14400,
    }
  Telegram:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Telegram.txt,
      format: text,
      url: "https://ruleset.skk.moe/Clash/ip/telegram.txt",
      interval: 14400,
    }
  Twitter:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Twitter.yaml,
      url: "https://raw.githubusercontent.com/Semporia/Clash/master/Rule/Twitter.yaml",
      interval: 14400,
    }
  Discord:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Discord.yaml,
      url: "https://raw.githubusercontent.com/Semporia/Clash/master/Rule/Discord.yaml",
      interval: 14400,
    }
  Apple:
    {
      type: http,
      behavior: classical,
      path: ./Rule/Apple.yaml,
      url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.yaml",
      interval: 14400,
    }

rules:
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,steam@cn,DIRECT
  - RULE-SET,Google,Google
  - RULE-SET,GitHub,GitHub
  - RULE-SET,Microsoft,Microsoft
  - RULE-SET,Netflix,Netflix
  - RULE-SET,Speedtest,Speedtest
  - RULE-SET,Steam,Steam
  - RULE-SET,Telegram,Telegram
  - RULE-SET,Twitter,Twitter
  - RULE-SET,Discord,Discord
  - GEOSITE,apple,Apple
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,REJECT
