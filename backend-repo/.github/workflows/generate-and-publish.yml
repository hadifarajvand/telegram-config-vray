name: Generate And Publish Outputs

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: generate-and-publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare runtime directories
        run: |
          chmod +x scripts/prepare_runtime_dirs.sh
          ./scripts/prepare_runtime_dirs.sh

      - name: Compile check
        run: |
          python -m py_compile main.py scraper/collector.py feeds/output_generation.py api/server.py

      - name: Generate outputs
        run: |
          python main.py

      - name: Validate required outputs
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "layers/ipv4"
            "layers/clash.yaml"
            "layers/ipv4-clash-verge.yaml"
            "subscribe/layers/ipv4"
            "subscribe/layers/ipv4-clash-verge.yaml"
            "channels/layers/ipv4"
            "channels/layers/ipv4-clash-verge.yaml"
          )
          for f in "${required[@]}"; do
            [[ -s "$f" ]] || { echo "Missing or empty output: $f"; exit 1; }
          done

      - name: Checkout target output repo
        uses: actions/checkout@v4
        with:
          repository: hadifarajvand/telegram-config-vray
          ref: main
          path: target-repo
          token: ${{ secrets.OUTPUT_REPO_PAT }}

      - name: Sync outputs only
        run: |
          chmod +x scripts/sync_outputs_to_target.sh
          ./scripts/sync_outputs_to_target.sh "$PWD" "$PWD/target-repo" "$PWD/config/output_paths.txt"

      - name: Commit and push target changes
        working-directory: target-repo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No target changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh generated outputs [skip ci]"
          git push origin main
