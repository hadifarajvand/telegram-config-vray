name: Update Feeds

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile main.py scraper/collector.py feeds/output_generation.py api/server.py

      - name: Generate feeds
        run: |
          python main.py

      - name: Strict output validation
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "layers/ipv4"
            "layers/clash.yaml"
            "layers/ipv4-clash-verge.yaml"
            "subscribe/layers/ipv4"
            "subscribe/layers/ipv4-clash-verge.yaml"
            "channels/layers/ipv4"
            "channels/layers/ipv4-clash-verge.yaml"
          )
          for f in "${required_files[@]}"; do
            if [[ ! -s "$f" ]]; then
              echo "Required output missing or empty: $f"
              exit 1
            fi
          done

      - name: Detect changes
        id: detect_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changes
        if: steps.detect_changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh feeds [skip ci]"

      - name: Push changes
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: git push
