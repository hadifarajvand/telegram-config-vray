mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
proxies: []
proxy-groups:
- name: Proxy-Select
  type: select
  proxies:
  - Auto-Lowest-Delay
  - Load-Balance
  - DIRECT
- name: Auto-Lowest-Delay
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: false
  timeout: 5000
  max-failed-times: 3
  tolerance: 80
  proxies: &id001 []
- name: Load-Balance
  type: load-balance
  url: https://www.gstatic.com/generate_204
  interval: 600
  lazy: false
  timeout: 5000
  max-failed-times: 3
  strategy: round-robin
  proxies: *id001
rules:
- MATCH,DIRECT
